name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# A newer push to the same branch/PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Manifest is valid JSON
        shell: pwsh
        run: Get-Content bucket/pennyframe.json -Raw | ConvertFrom-Json | Out-Null

  # Catches macOS-only build breakage before a release does.
  macos-build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # wails build passes this framework to the linker itself; plain go build needs it spelled out.
      - run: go build -tags desktop,production -o /dev/null .
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers
      - name: Cask is valid Ruby
        run: ruby -c Casks/pennyframe.rb
