name: release

# Push a tag like v0.2.0 to build, publish the Scoop zip and update the bucket manifest.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install wails
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build, package, update manifest
        shell: pwsh
        run: ./scripts/release.ps1 -Version ('${{ github.ref_name }}' -replace '^v', '') -Repo '${{ github.repository }}' -SkipTests

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --title "${{ github.ref_name }}" --generate-notes

      - name: Commit updated manifest to main
        shell: bash
        run: |
          cp bucket/pennyframe.json "$RUNNER_TEMP/pennyframe.json"
          git checkout -- bucket/pennyframe.json
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/pennyframe.json" bucket/pennyframe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pennyframe.json
          git diff --cached --quiet || git commit -m "chore(bucket): update pennyframe to ${{ github.ref_name }}"
          git push origin main
